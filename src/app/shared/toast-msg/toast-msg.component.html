@if (state == 'error') {
    <div class="content">
        <div class="rectangle red"></div>
        <div class="inner-content">
            <img src="icon/exclamation-circle.png" alt="exclamation-circle">
            <p>{{ msg }}</p>
            <div class="separator"></div>
            <img (click)="toastMsgSerivce.removeToastMsg()" class="icon-close" src="icon/close.png" alt="close">
        </div>
    </div>
} @else if (state == 'ok') {
    <div class="content">
        <div class="rectangle green"></div>
        <div class="inner-content">
            <p>{{ msg }}</p>
            <div class="separator"></div>
            <img (click)="toastMsgSerivce.removeToastMsg()" class="icon-close" src="icon/close.png" alt="close">
        </div>
    </div>
}
