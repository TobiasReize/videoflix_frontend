<div #videoContainer class="video-container">
    <video (click)="togglePlay()" #videoPlayer class="vjs-custom-style video-js"></video>

    <div class="custom-controls">
        <div class="progress-bar">
            <div class="progress-bar-track" #progressBar (click)="setVideoProgress($event)">
                <div class="progress-bar-track-loaded" [style.width]="videoProgress + '%'"></div>
                <div class="progress-bar-thumb" [style.left]="videoProgress + '%'"></div>
            </div>
            <div class="progress-time">{{ videoDuration }}</div>
        </div>
        <div class="controls">
            <div class="controls-left">
                <span (click)="togglePlay()" [ngClass]="player.paused() ? 'vjs-icon-play' : 'vjs-icon-pause'"></span>
                <img (click)="rewind()" src="icon/replay_10.png" alt="replay_10">
                <img (click)="fastForward()" src="icon/forward_10.png" alt="forward_10">
                <div class="volume-container">
                    <span (click)="toggleMute()" class="volume-icon" [ngClass]="getVolumeIcon()"></span>
                    <input class="volume-track" type="range" name="volume" min="0" max="100" step="5" [value]="(player.volume() || 0) * 100" (input)="setVolume($event)">
                </div>
            </div>
            <div class="controls-middle">
                <span>Majestic whales</span>
            </div>
            <div class="controls-right">
                <div class="video-speed-container">
                    <img (click)="selectSpeed()" src="icon/speed.png" alt="speed">
                    @if (showSpeed) {
                        <div class="video-speed">
                            <span>120p</span>
                            <span>360p</span>
                            <span>720p</span>
                            <span>1080p</span>
                        </div>
                    }
                </div>
                <span (click)="toggleFullscreen()" [ngClass]="isFullscreen ? 'vjs-icon-fullscreen-exit' : 'vjs-icon-fullscreen-enter'"></span>
            </div>
        </div>
    </div>    
</div>
